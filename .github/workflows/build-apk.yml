# Copie de secours du fichier de compilation.
# Utilise-le UNIQUEMENT si le dossier .github n'a pas pu être envoyé sur GitHub :
# dans ce cas, crée le fichier .github/workflows/build-apk.yml sur GitHub et
# colle ici tout son contenu (sans cette ligne de commentaire).

