name: Construire l'APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les outils système
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git zip unzip openjdk-17-jdk-headless \
            autoconf automake libtool pkg-config zlib1g-dev \
            libncurses-dev libsqlite3-dev libbz2-dev liblzma-dev \
            cmake libffi-dev libssl-dev

      - name: Installer buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer==1.5.0 cython==0.29.36

      - name: Mettre en cache les outils Android
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.android
            ~/.cache/pip
          key: buildozer-kivy23-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Construire l'APK
        run: |
          buildozer -v android debug

      - name: Vérifier l'APK produit
        run: |
          ls -la bin/

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-bibliotheque
          path: bin/*.apk
          if-no-files-found: error

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les outils système
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git zip unzip openjdk-17-jdk-headless \
            autoconf automake libtool pkg-config zlib1g-dev \
            libncurses-dev cmake libffi-dev libssl-dev

      - name: Installer buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython

      - name: Mettre en cache les outils Android
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.android
            ~/.cache/pip
          key: buildozer-v1-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-v1-${{ runner.os }}-

      - name: Construire l'APK
        run: |
          buildozer -v android debug

      - name: Vérifier l'APK produit
        run: |
          ls -la bin/

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-bibliotheque
          path: bin/*.apk
          if-no-files-found: error
